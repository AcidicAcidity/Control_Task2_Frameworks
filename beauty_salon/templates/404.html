{% extends "base.html" %}
{% block title %}Не найдено{% endblock %}
{% block content %}
<div class="empty-message">
  <h1>404 — визит не найден</h1>
  <p>Визита{% if slug %} «{{ slug }}»{% endif %} не существует или он был удалён.</p>

</div>
{% endblock %}
